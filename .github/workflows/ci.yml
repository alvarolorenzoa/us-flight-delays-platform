name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit tests (ingestion)
        run: pytest -v

      - name: Build an offline lake from synthetic source files
        run: python tests/make_fixture_lake.py --lake data/lake --rows 3000 --months 3

      - name: dbt build (models + 35 data tests) on the fixture lake
        env:
          LAKE_PATH: ${{ github.workspace }}/data/lake
          DUCKDB_PATH: ${{ github.workspace }}/data/ci.duckdb
        run: |
          mkdir -p data/lake/gold
          dbt seed  --project-dir dbt --profiles-dir dbt
          dbt build --project-dir dbt --profiles-dir dbt
